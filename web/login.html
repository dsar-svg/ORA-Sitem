<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1220">
  <title>Iniciar sesión · ORA</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest">
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-identity" aria-label="ORA">
      <div class="brand"><svg class="ora-mark" width="38" height="38" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#141a2e"/><circle cx="21.5" cy="28" r="10" fill="none" stroke="#e3b766" stroke-width="3.6"/><circle cx="42.5" cy="28" r="10" fill="none" stroke="#e3b766" stroke-width="3.6"/><path d="M29.5 26.5q2.5-2 5 0" fill="none" stroke="#e3b766" stroke-width="3" stroke-linecap="round"/><circle cx="21.5" cy="28" r="4.6" fill="#e3b766"/><circle cx="42.5" cy="28" r="4.6" fill="#e3b766"/><path d="M26.5 41.5q5.5-3.6 11 0L32 49z" fill="#e3b766"/></svg>ORA</div>
      <img class="login-ora" src="/ora/ora.webp" alt="" width="220" height="220">
      <p>Reportes y seguimiento listos. <strong>Más tiempo para decidir.</strong></p>
    </section>
    <section class="login-sheet" aria-labelledby="login-title">
      <div class="login-source"><i aria-hidden="true"></i>{{host}}</div>
      <h1 id="login-title">Iniciar sesión</h1>
      <p class="login-intro">Entra a tus reportes con tu cuenta de Odoo.</p>
      <form method="post" action="/login">
        <label for="email">Correo de Odoo</label>
        <input type="email" name="email" id="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="tu@empresa.com" required>
        <label for="password">Contraseña</label>
        <div class="login-password">
          <input type="password" name="password" id="password" autocomplete="current-password" required>
          <button type="button" id="togglePassword" aria-label="Mostrar contraseña" aria-controls="password" hidden>Mostrar</button>
        </div>
        <p class="login-error" role="alert">{{message}}</p>
        <button class="login-submit" type="submit">Entrar a ORA</button>
      </form>
    </section>
  </main>
</body></html>
