<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f6f7"><title>Ventas · ORA</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><script src="/boot.js"></script></head>
<body><aside id="sidebar"><div class="brand"><i class="focus"></i>ORA</div><div class="nav-title">ESPACIO DE ANÁLISIS</div><nav aria-label="Reportes"><button data-module="sales"><i data-icon="chart"></i>Ventas</button><button data-module="ar"><i data-icon="wallet"></i>Cuentas por cobrar</button><button data-module="clients"><i data-icon="users"></i>Clientes</button><button data-module="inventory"><i data-icon="box"></i>Inventario</button></nav><div class="aside-foot"><div class="rings" aria-hidden="true"></div><details id="accountMenu"><summary aria-label="Menú de usuario"><i data-icon="user"></i><span>Perfil de demo</span></summary><div class="profile-menu"><button id="openAppearance">Apariencia</button><button id="openTour">Recorrido guiado</button><form id="logout" method="post" action="/logout" hidden><button>Cerrar sesión</button></form></div></details></div></aside>
<dialog id="mobileNav" aria-label="Navegación"><button id="navClose" aria-label="Cerrar menú"></button></dialog><main><header><button id="navOpen" aria-label="Abrir menú lateral"></button><div class="company"><span class="avatar"><i data-icon="building"></i></span><strong id="company">ORA</strong><span class="badge"></span></div><div class="account"><span class="sync" id="sync" role="status">Cargando datos…</span></div></header>
<div class="page"><div id="tourOffer" hidden><span>Conoce los reportes de tu plan</span><button id="tourStart">Iniciar recorrido</button><button id="tourDismiss">Omitir</button></div><h1 id="title">Resumen de ventas</h1><p class="subtitle" id="subtitle"></p>
<div class="filters"><label><i data-icon="calendar"></i><select id="period" aria-label="Período"></select></label><label><select id="currency" aria-label="Moneda"></select></label><button id="filterToggle" aria-controls="secondaryFilters" aria-expanded="false">Filtros <span id="filterCount"></span></button><div id="secondaryFilters"><label><i data-icon="pin"></i><select id="branch" aria-label="Sucursal"></select></label><label hidden><select id="seller" aria-label="Vendedor"></select></label><label hidden><select id="zone" aria-label="Zona"></select></label><label id="prodLabel"><select id="product" aria-label="Producto"></select></label><label hidden><select id="statementCustomer" aria-label="Cliente del estado de cuenta"></select></label><label hidden><select id="warehouse" aria-label="Almacén"></select></label><label hidden><select id="category" aria-label="Categoría"></select></label><label hidden><select id="stockProduct" aria-label="Producto de inventario"></select></label></div></div>
<div class="report-bar" id="reportBar" hidden><div class="report-tabs" role="group" aria-label="Vista del reporte"></div><div id="viewExport"></div></div>
<div id="docFilters" class="doc-filters" hidden><label>Buscar documento o cliente<input type="search" id="docSearch" placeholder="Número o nombre"></label><label>Desde<input type="date" id="docFrom"></label><label>Hasta<input type="date" id="docUntil"></label><label>Tipo<select id="docType"><option value="">Todos</option><option value="invoice">Factura</option><option value="credit">Nota de crédito</option></select></label></div>
<div id="restockControls" class="doc-filters" hidden><label>Período de consumo<select id="demandMonths" aria-label="Período de consumo"><option value="1">1 mes</option><option value="2">2 meses</option><option value="3">3 meses</option></select></label><label>Plazo de entrega (días)<input id="leadDays" type="number" min="0" max="365" step="1" placeholder="Según producto"></label><label>Seguridad (unidades)<input id="safetyUnits" type="number" min="0" max="10000000" step="1" placeholder="Según producto"></label><label>Prioridad<select id="stockPriority"><option value="">Todas</option><option>Prioritario</option><option>Revisar pronto</option><option>Sin urgencia</option><option>Datos insuficientes</option></select></label></div><section id="dashboard" aria-label="Indicadores del reporte"><div class="loader" role="status"><span></span>Cargando reporte…</div></section><footer>ORA · Organización de Reportes para Análisis <span></span></footer></div></main>
<dialog id="detail" aria-labelledby="dt"><div class="dialog-head"><div><small id="detailKind">DOCUMENTOS DE RESPALDO</small><h2 id="dt"></h2></div><button id="close" aria-label="Cerrar detalle"></button></div><div id="detailBody"></div></dialog>
<dialog id="appearance" aria-labelledby="appearanceTitle"><div class="dialog-head"><h2 id="appearanceTitle">Apariencia</h2><button id="closeAppearance" aria-label="Cerrar apariencia"></button></div><p>Paleta del portal</p><div id="palettes"></div><label class="accent-input">Color de acento <input type="color" id="accent"></label><p id="contrast" role="status"></p><button class="secondary" id="resetTheme">Restablecer Pizarra</button></dialog>
<dialog id="tour" aria-label="Recorrido guiado"><div id="tourSpot" aria-hidden="true"></div><div id="tourCard"><div id="tourCourses"><h2>Recorrido guiado</h2><div id="courseList"></div><button id="tourCancel">Cerrar</button></div><div id="tourSteps"><div aria-live="polite" aria-atomic="true"><small id="tourCount"></small><h2 id="tourTitle"></h2><p id="tourText"></p></div><div class="tour-actions"><button id="tourSkip">Omitir</button><button id="tourPrev">Anterior</button><button id="tourNext">Siguiente</button></div></div></div></dialog><script type="module" src="/portal.js"></script></body></html>
